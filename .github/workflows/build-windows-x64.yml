name: build-windows-x64

# 云端 x64 构建：push 到 main、提 PR 或手动触发都会跑一次，
# 打出 onefile exe 并作为 artifact 上传（30 天保留）。
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - '.github/workflows/**'
  pull_request:
    paths:
      - 'src/**'
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHONIOENCODING: utf-8
  PYTHONUTF8: '1'

jobs:
  build:
    name: windows-x64
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.10 (x64)
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          architecture: 'x64'
          cache: pip
          cache-dependency-path: src/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r src/requirements.txt
          python -m pip install "pyinstaller==6.22.3"
          python -c "import sys, PyInstaller; print(sys.version); print('PyInstaller', PyInstaller.__version__)"

      - name: Compile check
        working-directory: src
        run: python -m compileall -q shell app.py quark_core.py cdp.py quark_login.py

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Build onefile exe
        working-directory: src/shell
        run: python build2.py

      - name: Verify artifact
        id: verify
        shell: pwsh
        run: |
          $exe = "src/shell/dist/QuarkAccel.exe"
          if (-not (Test-Path $exe)) { throw "missing $exe" }
          $f = Get-Item $exe
          if ($f.Length -lt 6MB) { throw "exe too small: $($f.Length) bytes" }
          $bytes = [System.IO.File]::ReadAllBytes($exe)
          if ($bytes[0] -ne 0x4D -or $bytes[1] -ne 0x5A) { throw "not a PE file (no MZ)" }
          $peOff = [BitConverter]::ToInt32($bytes, 0x3C)
          if ($bytes[$peOff] -ne 0x50 -or $bytes[$peOff+1] -ne 0x45 -or
              $bytes[$peOff+2] -ne 0 -or $bytes[$peOff+3] -ne 0) {
            throw "bad PE signature at $peOff"
          }
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLower()
          "size=$($f.Length)"      | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append
          "sha256=$hash"           | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append
          "pe_offset=$peOff"       | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append
          "size=$($f.Length)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "sha256=$hash"      | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: File version info
        shell: pwsh
        run: |
          $vi = (Get-Item "src/shell/dist/QuarkAccel.exe").VersionInfo
          "ProductName=$($vi.ProductName) FileVersion=$($vi.FileVersion) Description=$($vi.FileDescription)" |
            Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: QuarkAccel-win-x64
          path: src/shell/dist/QuarkAccel.exe
          if-no-files-found: error
          retention-days: 30

      - name: Sync GitHub Release (latest)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $exe = "src/shell/dist/QuarkAccel.exe"
          $sha = $env:GITHUB_SHA.Substring(0, 7)
          $sizeMb = [math]::Round((Get-Item $exe).Length / 1MB, 2)
          $hash = "${{ steps.verify.outputs.sha256 }}"
          $title = "QuarkAccel 最新构建 ($sha)"
          $notes = "自动构建自 main 分支 ``$sha``。`n`n- 文件大小: $sizeMb MB`n- SHA256: ``$hash``"
          $exists = $false
          $oldPref = $ErrorActionPreference
          $ErrorActionPreference = 'Continue'
          gh release view latest 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) { $exists = $true }
          $ErrorActionPreference = $oldPref
          if ($exists) {
            gh release upload latest $exe --clobber
            gh release edit latest --title $title --notes $notes --target $env:GITHUB_SHA
          } else {
            gh release create latest $exe --title $title --notes $notes --target $env:GITHUB_SHA
          }
